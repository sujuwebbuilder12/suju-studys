    <script>
      (function () {
        var rootEl = document.getElementById("root");
        var SELECTOR =
          'netlify-badge, #netlify-badge, iframe[src*="netlify"], div[style*="z-index: 2147483647"], div[style*="z-index:2147483647"], a[href*="netlify.com"], [id*="netlify"], [class*="netlify"]';

        function isSafeToRemove(el) {
          if (!el || el.nodeType !== 1) return false;
          var tag = (el.tagName || "").toUpperCase();
          if (
            el === rootEl ||
            el === document.body ||
            el === document.documentElement ||
            tag === "HTML" ||
            tag === "HEAD" ||
            tag === "BODY" ||
            tag === "SCRIPT" ||
            tag === "STYLE" ||
            tag === "LINK" ||
            tag === "META" ||
            tag === "TITLE" ||
            (rootEl && rootEl.contains(el))
          ) {
            return false;
          }
          if (el.parentElement && el.parentElement.tagName === "HEAD") {
            return false;
          }
          return true;
        }

        function isNetlifyElement(node) {
          if (!isSafeToRemove(node)) return false;

          var tag = (node.tagName || "").toLowerCase();
          var id = typeof node.id === "string" ? node.id.toLowerCase() : "";
          var cls =
            typeof node.className === "string"
              ? node.className.toLowerCase()
              : "";
          var src =
            typeof node.getAttribute === "function"
              ? (node.getAttribute("src") || "").toLowerCase()
              : "";
          var href =
            typeof node.getAttribute === "function"
              ? (node.getAttribute("href") || "").toLowerCase()
              : "";

          if (
            tag.indexOf("netlify") !== -1 ||
            id.indexOf("netlify") !== -1 ||
            cls.indexOf("netlify") !== -1 ||
            src.indexOf("netlify") !== -1 ||
            href.indexOf("netlify.com") !== -1
          ) {
            return true;
          }

          if (typeof node.matches === "function" && node.matches(SELECTOR)) {
            return true;
          }

          if (node.shadowRoot) {
            var shadowHtml = (node.shadowRoot.innerHTML || "").toLowerCase();
            var shadowText = (node.shadowRoot.textContent || "").toLowerCase();
            if (
              shadowHtml.indexOf("netlify") !== -1 ||
              shadowText.indexOf("netlify") !== -1
            ) {
              return true;
            }
          }

          var text = (node.textContent || "").toLowerCase();
          if (text.indexOf("powered by netlify") !== -1) {
            return true;
          }

          return false;
        }

        function removeIfNetlifyBadge(node) {
          if (!isSafeToRemove(node)) return;

          if (isNetlifyElement(node)) {
            var topWrapper = node;
            while (
              topWrapper.parentElement &&
              topWrapper.parentElement !== document.body &&
              topWrapper.parentElement !== document.documentElement &&
              isSafeToRemove(topWrapper.parentElement)
            ) {
              topWrapper = topWrapper.parentElement;
            }
            topWrapper.remove();
            return;
          }

          if (typeof node.querySelectorAll === "function") {
            var nested = node.querySelectorAll("*");
            for (var i = nested.length - 1; i >= 0; i--) {
              if (isNetlifyElement(nested[i])) {
                nested[i].remove();
              }
            }
          }
        }

        function sweepDocument() {
          var allOutside = document.querySelectorAll(
            "body > *:not(#root):not(script):not(style), html > *:not(head):not(body)"
          );
          for (var i = allOutside.length - 1; i >= 0; i--) {
            removeIfNetlifyBadge(allOutside[i]);
          }
          var explicit = document.querySelectorAll(SELECTOR);
          for (var j = explicit.length - 1; j >= 0; j--) {
            removeIfNetlifyBadge(explicit[j]);
          }
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", sweepDocument);
        } else {
          sweepDocument();
        }
        window.addEventListener("load", sweepDocument);

        // Poll every 500ms for 10 seconds to catch delayed Shadow-DOM / iframe badge injections
        var elapsed = 0;
        var pollTimer = window.setInterval(function () {
          sweepDocument();
          elapsed += 500;
          if (elapsed >= 10000) {
            window.clearInterval(pollTimer);
          }
        }, 500);

        if (typeof MutationObserver !== "undefined" && document.documentElement) {
          var observer = new MutationObserver(function (mutations) {
            for (var m = 0; m < mutations.length; m++) {
              var target = mutations[m].target;
              if (rootEl && (target === rootEl || rootEl.contains(target))) {
                continue;
              }
              var added = mutations[m].addedNodes;
              for (var n = 0; n < added.length; n++) {
                removeIfNetlifyBadge(added[n]);
              }
            }
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        }
      })();
